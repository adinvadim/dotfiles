host: "127.0.0.1"
port: 8317
auth-dir: "~/.cli-proxy-api"

# Claude Code needs a non-empty dummy token; localhost clients need no proxy key.
api-keys: []

# A single transient upstream failure must not quarantine our only Codex credential.
transient-error-cooldown-seconds: -1

# Expose only the models used by our Codex, Kimi Code, and xAI subscriptions.
# CLIProxyAPI has exclusions but no allowlist; refresh after provider catalog upgrades.
oauth-excluded-models:
  codex:
    - "codex-auto-review"
    - "gpt-5.3-*"
    - "gpt-5.4*"
    - "gpt-5.5"
    - "gpt-5.6-luna"
    - "gpt-image-*"
  xai:
    - "grok-3-*"
    - "grok-4.20-*"
    - "grok-4.3"
    - "grok-build-*"
    - "grok-composer-*"
    - "grok-imagine-*"
  kimi:
    - "kimi-k2"
    - "kimi-k2-thinking"
    - "kimi-k2.5"
    - "kimi-k2.6"

# Need CLIProxyAPI >= 7.2.111 for real `kimi-k3-256k` (256k K3, lower quota).
# Do not alias it onto `kimi-k3` — that is the separate 1M model.

debug: false
