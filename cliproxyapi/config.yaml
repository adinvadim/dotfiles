host: "127.0.0.1"
port: 8317
auth-dir: "~/.cli-proxy-api"

# Claude Code needs a non-empty dummy token; localhost clients need no proxy key.
api-keys: []

# Expose only GPT-5.6 Sol and Grok 4.5 from non-Anthropic OAuth providers.
# CLIProxyAPI has exclusions but no allowlist; refresh after provider catalog upgrades.
oauth-excluded-models:
  codex:
    - "codex-auto-review"
    - "gpt-5.3-*"
    - "gpt-5.4*"
    - "gpt-5.5"
    - "gpt-5.6-luna"
    - "gpt-5.6-terra"
    - "gpt-image-*"
  xai:
    - "grok-3-*"
    - "grok-4.20-*"
    - "grok-4.3"
    - "grok-build-*"
    - "grok-composer-*"
    - "grok-imagine-*"

debug: false
