- defaults:
    link:
      relink: true

- clean: ['~']

- create:
    - ~/.config
    - ~/.config/coc
    - ~/.pi/agent
    - ~/.pi/agent/agents
    - ~/.pi/agent/extensions
    - ~/.agents/skills
    - ~/.codex/skills
    - ~/.claude/skills
    - ~/bin

- shell:
  # Make AGENTS.md / CLAUDE.md linking idempotent (backup if a regular file already exists).
  - sh -c 'if [ -e "$HOME/.codex/AGENTS.md" ] && [ ! -L "$HOME/.codex/AGENTS.md" ]; then mv "$HOME/.codex/AGENTS.md" "$HOME/.codex/AGENTS.md.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.claude/CLAUDE.md" ] && [ ! -L "$HOME/.claude/CLAUDE.md" ]; then mv "$HOME/.claude/CLAUDE.md" "$HOME/.claude/CLAUDE.md.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.claude/settings.json" ] && [ ! -L "$HOME/.claude/settings.json" ]; then mv "$HOME/.claude/settings.json" "$HOME/.claude/settings.json.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.pi/agent/AGENTS.md" ] && [ ! -L "$HOME/.pi/agent/AGENTS.md" ]; then mv "$HOME/.pi/agent/AGENTS.md" "$HOME/.pi/agent/AGENTS.md.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.pi/agent/agents/scout.md" ] && [ ! -L "$HOME/.pi/agent/agents/scout.md" ]; then mv "$HOME/.pi/agent/agents/scout.md" "$HOME/.pi/agent/agents/scout.md.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.pi/agent/agents/docs-scout.md" ] && [ ! -L "$HOME/.pi/agent/agents/docs-scout.md" ]; then mv "$HOME/.pi/agent/agents/docs-scout.md" "$HOME/.pi/agent/agents/docs-scout.md.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.pi/agent/settings.json" ] && [ ! -L "$HOME/.pi/agent/settings.json" ]; then mv "$HOME/.pi/agent/settings.json" "$HOME/.pi/agent/settings.json.bak.$(date +%Y%m%d%H%M%S)"; fi'
  - sh -c 'if [ -e "$HOME/.pi/agent/extensions/status-footer.ts" ] && [ ! -L "$HOME/.pi/agent/extensions/status-footer.ts" ]; then mv "$HOME/.pi/agent/extensions/status-footer.ts" "$HOME/.pi/agent/extensions/status-footer.ts.bak.$(date +%Y%m%d%H%M%S)"; fi'
  # Copy ~/.codex/config.toml as-is.
  # Remove stale symlink first, then replace atomically via temp file.
  - sh -c 'rm -f "$HOME/.codex/config.toml"; t=$(mktemp) && cp "$PWD/codex/config.toml" "$t" && mv "$t" "$HOME/.codex/config.toml"'

- link:
    ~/.tmux.conf: .tmux.conf
    ~/.gitconfig: .gitconfig
    ~/.gitmux.conf: .gitmux.conf
    ~/.nuxtrc: .nuxtrc
    ~/.ripgreprc: .ripgreprc
    ~/.zshrc: .zshrc
    ~/.config/nvim: nvim
    ~/bin/tat: bin/tat
    ~/bin/kill-by-port: bin/kill-by-port
    ~/bin/kitty-dark: bin/kitty-dark
    ~/bin/tmux-gh-pr: bin/tmux-gh-pr
    ~/bin/tmux-gh-pr-open: bin/tmux-gh-pr-open
    ~/bin/tmux-ai-status: bin/tmux-ai-status
    ~/bin/tmux-subscript: bin/tmux-subscript
    ~/bin/db: bin/db
    ~/bin/ohmydb: bin/ohmydb
    ~/bin/docs-list: bin/docs-list
    /opt/homebrew/share/zsh/site-functions/_db: bin/_db
    /opt/homebrew/share/zsh/site-functions/_ohmydb: bin/_ohmydb
    ~/.editorconfig: .editorconfig
    ~/.codex/AGENTS.md: AGENTS.md
    ~/.claude/CLAUDE.md: CLAUDE.md
    ~/.claude/settings.json: claude/settings.json
    ~/.config/kitty: kitty
    ~/.config/coc/ultisnips: ultisnips
    ~/.pi/agent/AGENTS.md: pi/agent/AGENTS.md
    ~/.pi/agent/agents/scout.md: pi/agent/agents/scout.md
    ~/.pi/agent/agents/docs-scout.md: pi/agent/agents/docs-scout.md
    ~/.pi/agent/settings.json: pi/agent/settings.json
    ~/.pi/agent/extensions/status-footer.ts: pi/agent/extensions/status-footer.ts
    ~/safari-global.css: safari/global.css
    ~/.agents/skills/create-cli: agents/skills/create-cli
    ~/.codex/skills/create-cli: agents/skills/create-cli
    ~/.claude/skills/create-cli: agents/skills/create-cli
    ~/.agents/skills/code-simplifier: agents/skills/code-simplifier
    ~/.codex/skills/code-simplifier: agents/skills/code-simplifier
    ~/.claude/skills/code-simplifier: agents/skills/code-simplifier

- create:
    - ~/.vim/undo-history

- shell:
  - [git submodule update --init --recursive, Installing submodules]
  - sh -c 'if ! npm ls -g --depth=0 @mariozechner/pi-coding-agent >/dev/null 2>&1; then npm install -g @mariozechner/pi-coding-agent; fi'
  - sh -c 'if [ ! -x "$HOME/.bun/bin/bun" ]; then curl -fsSL https://bun.sh/install | bash; fi'
  - sh -c 'curl -fLo "${XDG_DATA_HOME:-$HOME/.local/share}"/nvim/site/autoload/plug.vim --create-dirs https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim'
  - sh -c 'if [ ! -d "$HOME/.oh-my-zsh" ]; then RUNZSH=no CHSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"; fi'
  - sh -c 'if [ -f "$HOME/.zshrc.pre-oh-my-zsh" ]; then mv "$HOME/.zshrc.pre-oh-my-zsh" "$HOME/.zshrc"; fi'
  - sh -c 'if [ ! -d "$HOME/.tmux/plugins/tpm" ]; then mkdir -p "$HOME/.tmux/plugins" && git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm"; fi'
